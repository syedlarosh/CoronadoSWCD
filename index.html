<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Map - Final Fixed</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box
        }



        body {

            font-family: 'Inter', sans-serif;

            background: #F5F7FA;

            height: 100vh;

            overflow: hidden
        }



        #app {

            display: flex;

            flex-direction: column;

            height: 100vh
        }



        header {

            background: white;

            padding: 12px 24px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid #E5E7EB;

            flex-wrap: wrap;

            gap: 10px;

            z-index: 10
        }



        .logo {

            font-size: 22px;

            font-weight: 800;

            color: #2F3E9E;

            display: flex;

            align-items: center;

            gap: 10px
        }



        .logo span {

            font-size: 12px;

            font-weight: 400;

            color: #6B7280
        }



        .controls {

            display: flex;

            gap: 8px;

            align-items: center;

            flex-wrap: wrap
        }



        .controls button {

            padding: 6px 14px;

            border: none;

            border-radius: 8px;

            font-weight: 600;

            font-size: 12px;

            cursor: pointer;

            transition: all .2s;

            height: 36px;

            white-space: nowrap
        }



        .controls button:hover {

            transform: translateY(-2px);

            box-shadow: 0 4px 12px rgba(0, 0, 0, .15)
        }



        .btn-inprogress {

            background: #FF8C00;

            color: white
        }



        .btn-completed {

            background: #10B981;

            color: white
        }



        .btn-reset {

            background: #6B7280;

            color: white
        }



        .btn-save {

            background: #2F3E9E;

            color: white
        }



        .btn-clear {

            background: #EF4444;

            color: white
        }



        #main {

            display: flex;

            flex: 1;

            overflow: hidden;

            gap: 16px;

            padding: 16px
        }



        #sidebar {

            width: 340px;

            background: white;

            border-radius: 16px;

            padding: 16px 20px;

            overflow-y: auto;

            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);

            flex-shrink: 0
        }



        #sidebar h3 {

            font-size: 13px;

            font-weight: 700;

            color: #2F3E9E;

            margin-bottom: 12px;

            text-transform: uppercase
        }



        .stat-grid {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 8px;

            margin-bottom: 20px
        }



        .stat-card {

            background: #F9FAFE;

            border-radius: 10px;

            padding: 10px;

            text-align: center;

            border: 1px solid #E5E7EB
        }



        .stat-card .stat-value {

            font-size: 22px;

            font-weight: 800;

            display: block
        }



        .stat-card .stat-label {

            font-size: 10px;

            color: #6B7280;

            font-weight: 500
        }



        .stat-card.inprogress .stat-value {

            color: #FF8C00
        }



        .stat-card.completed .stat-value {

            color: #10B981
        }



        .filter-group {

            margin-bottom: 12px
        }



        .filter-group label {

            display: block;

            font-size: 11px;

            font-weight: 600;

            color: #4B5563;

            margin-bottom: 4px
        }



        .filter-group input,

        .filter-group select {

            width: 100%;

            padding: 8px 10px;

            border: 1px solid #E5E7EB;

            border-radius: 8px;

            font-family: 'Inter', sans-serif;

            font-size: 12px;

            background: white
        }



        .filter-group input:focus,

        .filter-group select:focus {

            outline: none;

            border-color: #2F3E9E;

            box-shadow: 0 0 0 3px rgba(47, 62, 158, .1)
        }



        .filter-actions {

            display: flex;

            gap: 8px;

            margin-top: 10px
        }



        .filter-actions button {

            flex: 1;

            padding: 6px;

            border: 1px solid #E5E7EB;

            border-radius: 8px;

            background: white;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer
        }



        .filter-actions button:hover {

            background: #F9FAFE;

            border-color: #2F3E9E
        }



        #map-container {

            flex: 1;

            border-radius: 16px;

            overflow: hidden;

            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);

            position: relative
        }



        #map {

            width: 100%;

            height: 100%;

            background: #EFF3F8
        }



        .map-legend {

            position: absolute;

            bottom: 20px;

            left: 20px;

            background: rgba(255, 255, 255, .95);

            padding: 10px 16px;

            border-radius: 12px;

            z-index: 400;

            font-size: 11px;

            border: 1px solid #E5E7EB
        }



        .legend-item {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 4px
        }



        .legend-color {

            width: 14px;

            height: 14px;

            border-radius: 4px
        }



        .legend-color.boundary {

            background: transparent;

            border: 2px solid #FF0000
        }



        .toast {

            position: fixed;

            bottom: 30px;

            right: 30px;

            padding: 12px 24px;

            border-radius: 12px;

            background: #2F3E9E;

            color: white;

            font-size: 13px;

            font-weight: 500;

            z-index: 10000;

            animation: slideUp .3s
        }



        .toast.error {

            background: #EF4444
        }



        @keyframes slideUp {

            from {

                opacity: 0;

                transform: translateY(20px)
            }



            to {

                opacity: 1;

                transform: translateY(0)
            }

        }



        @keyframes spin {

            to {

                transform: rotate(360deg)
            }

        }



        #loadingOverlay {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(47, 62, 158, .9);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 9999
        }



        .loading-card {

            background: white;

            padding: 40px;

            border-radius: 20px;

            text-align: center
        }



        .spinner {

            width: 40px;

            height: 40px;

            border: 3px solid #E5E7EB;

            border-top-color: #2F3E9E;

            border-radius: 50%;

            animation: spin .8s linear infinite;

            margin: 0 auto 16px
        }



        .suggestions-wrapper {

            position: relative
        }



        .suggestions-dropdown {

            position: absolute;

            top: 100%;

            left: 0;

            right: 0;

            background: white;

            border: 1px solid #E5E7EB;

            border-radius: 8px;

            max-height: 220px;

            overflow-y: auto;

            z-index: 9999;

            box-shadow: 0 8px 24px rgba(0, 0, 0, .18);

            display: none;

            margin-top: 4px
        }



        .suggestions-dropdown.show {

            display: block
        }



        .suggestions-dropdown .suggestion-item {

            padding: 10px 14px;

            cursor: pointer;

            font-size: 12px;

            border-bottom: 1px solid #F3F4F6;

            transition: all .15s;

            line-height: 1.5;

        }



        .suggestions-dropdown .suggestion-item:hover {

            background: #EEF2FF
        }



        .suggestion-item .main {

            font-weight: 600;

            color: #1F2937;

            display: block;

        }



        .suggestion-item .sub {

            font-size: 10px;

            color: #6B7280;

            display: block;

            margin-top: 3px;

        }



        .suggestion-item:hover .main {

            color: #2F3E9E
        }



        @media(max-width:768px) {

            #main {

                flex-direction: column;

                padding: 10px
            }



            #sidebar {

                width: 100%;

                max-height: 280px
            }

        }
    </style>

</head>



<body>

    <div id="app">

        <header>

            <div class="logo">🏘️ Property Map <span></span></div>

            <div class="controls">
                <!-- 🔴 YEH DROPDOWN ADD KARO - SABSE PEHLE -->
                <select id="baseMapSelector"
                    style="padding:6px 12px;border:1px solid #E5E7EB;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;background:white;height:36px;cursor:pointer;">
                    <option value="carto">🗺️ Carto Light</option>
                    <option value="osm">🌍 OpenStreetMap</option>
                    <option value="satellite" selected>🛰️ Satellite</option> <!-- 🔴 YAHAN selected ADD KARO -->
                    <option value="topo">⛰️ Topographic</option>
                    <option value="dark">🌙 Dark Mode</option>
                    <option value="streets">🏙️ Streets</option>
                </select>

                <button id="markInProgress" class="btn-inprogress">⏳ IN PROGRESS</button>
                <button id="markCompleted" class="btn-completed">✅ COMPLETED</button>
                <button id="clearSelection" class="btn-clear">✖️ Clear</button>
                <button id="resetChanges" class="btn-reset">↩️ Reset</button>
                <button id="saveChanges" class="btn-save">💾 Save</button>
            </div>

        </header>

        <div id="main">

            <div id="sidebar">

                <div class="stats">

                    <h3>📊 Statistics</h3>

                    <div class="stat-grid">

                        <div class="stat-card"><span class="stat-value" id="totalCount">0</span><span
                                class="stat-label">Total</span></div>

                        <div class="stat-card inprogress"><span class="stat-value" id="inprogressCount">0</span><span
                                class="stat-label">IN PROGRESS</span></div>

                        <div class="stat-card completed"><span class="stat-value" id="completedCount">0</span><span
                                class="stat-label">COMPLETED</span></div>

                    </div>

                </div>

                <div class="filters">

                    <h3>🔍 Interconnected Filters</h3>

                    <div class="filter-group"><label>Status</label><select id="statusFilter" onchange="applyFilters()">

                            <option value="ALL">All</option>

                            <option value="IN PROGRESS">⏳ IN PROGRESS</option>

                            <option value="COMPLETED">✅ COMPLETED</option>

                        </select></div>

                    <div class="filter-group"><label>Owner</label>

                        <div class="suggestions-wrapper"><input type="text" id="ownerFilter"
                                placeholder="Search owner..." autocomplete="off" oninput="showSuggestions('owner')"
                                onfocus="showSuggestions('owner')">

                            <div class="suggestions-dropdown" id="ownerSuggestions"></div>

                        </div>

                    </div>

                    <div class="filter-group"><label>Parcel</label>

                        <div class="suggestions-wrapper"><input type="text" id="parcelFilter"
                                placeholder="Search parcel..." autocomplete="off" oninput="showSuggestions('parcel')"
                                onfocus="showSuggestions('parcel')">

                            <div class="suggestions-dropdown" id="parcelSuggestions"></div>

                        </div>

                    </div>

                    <div class="filter-group"><label>Address</label>

                        <div class="suggestions-wrapper"><input type="text" id="addressFilter"
                                placeholder="Search address..." autocomplete="off" oninput="showSuggestions('address')"
                                onfocus="showSuggestions('address')">

                            <div class="suggestions-dropdown" id="addressSuggestions"></div>

                        </div>

                    </div>

                    <div class="filter-actions"><button id="clearFiltersBtn" onclick="clearAllFilters()">✖️ Clear

                            All</button></div>

                </div>

            </div>

            <div id="map-container">

                <div id="map"></div>

                <div class="map-legend">

                    <div class="legend-item">

                        <div class="legend-color boundary"></div><span>Boundary</span>

                    </div>

                    <div class="legend-item">

                        <div class="legend-color"
                            style="background:transparent;border:2px solid #FF8C00;width:14px;height:14px;border-radius:4px">

                        </div><span>IN PROGRESS</span>

                    </div>

                    <div class="legend-item">

                        <div class="legend-color"
                            style="background:transparent;border:2px solid #10B981;width:14px;height:14px;border-radius:4px">

                        </div><span>COMPLETED</span>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div id="loadingOverlay">

        <div class="loading-card">

            <div class="spinner"></div>

            <p id="loadingText">Loading...</p>

        </div>

    </div>



    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const CONFIG = {
            BOUNDARY_URL: 'Boundary.geojson',
            PARCELS_URL: 'Parcels.geojson',
            SHEET_CSV_URL: 'https://docs.google.com/spreadsheets/d/1rB5ra-QHYh3QOPHu0rvRpkVs9ackeFK4HB1buB2oxKI/export?format=csv&gid=0',
            SHEET_WRITE_URL: 'https://script.google.com/macros/s/AKfycbwufWfKk3FEREcNvHDIDz8RLIV3ilXx5WXuCsgji78W261ZyXH5Ml_886PEV9maz2TA/exec',
            DEFAULT_VIEW: [38, -96], DEFAULT_ZOOM: 5,
            COLORS: { 'IN PROGRESS': '#FF8C00', 'COMPLETED': '#10B981', 'BOUNDARY': '#FF0000', 'HIGHLIGHT': '#FF0000' }
        };

        // 🔴🔴🔴 YEH BASE_MAPS OBJECT ADD KARO 🔴🔴🔴
        const BASE_MAPS = {
            carto: {
                url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB'
            },
            osm: {
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            },
            satellite: {
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                attribution: '&copy; Esri, Maxar, Earthstar'
            },
            topo: {
                url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
                attribution: '&copy; OpenTopoMap'
            },
            dark: {
                url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
                attribution: '&copy; OpenStreetMap, CartoDB'
            },
            streets: {
                url: 'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
                attribution: '&copy; OpenStreetMap France'
            }
        };

        let map, currentLayer, allFeatures = [], selectedFeatures = [], originalData = new Map();

        let hasChanges = false, isDataLoaded = false, hoveredLayer = null, highlightedFeature = null;

        let sheetDataMap = new Map(), allOwners = [], allParcels = [], allAddresses = [], activeSuggestionsDiv = null;



        function getObjectId(p) { return (p.OBJECTID_12 || p.objectid_12 || p.OBJECTID || p.objectid || p.FID || p.fid || '').toString().trim() }

        function showLoading(m) { document.getElementById('loadingText').textContent = m; document.getElementById('loadingOverlay').style.display = 'flex' }

        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none' }

        function showToast(m, e) { const x = document.querySelector('.toast'); if (x) x.remove(); const t = document.createElement('div'); t.className = 'toast' + (e ? ' error' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300) }, 3000) }



        async function loadSheetData() {
            try {
                const r = await fetch(CONFIG.SHEET_CSV_URL);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const csv = await r.text();
                const rows = csv.split('\n').filter(rw => rw.trim());
                if (rows.length < 2) return new Map();

                const h = rows[0].split(',').map(hd => hd.trim().toUpperCase());

                // 🔴 SAARE COLUMNS KE INDICES - LINK BHI ADD KARO
                const oi = h.indexOf('OBJECTID_12');
                const ai = h.indexOf('ADDRESS');
                const si = h.indexOf('SIGNER');
                const owi = h.indexOf('OWNER');
                const pi = h.indexOf('PARCEL');
                const sti = h.indexOf('STATUS');
                const li = h.indexOf('LINK'); // 🔴 LINK COLUMN ADD KARO

                const dm = new Map();

                for (let i = 1; i < rows.length; i++) {
                    const c = parseCSVRow(rows[i]);
                    const oid = oi >= 0 ? (c[oi] || '').trim().toString() : '';
                    if (oid) {
                        dm.set(oid, {
                            objectId: oid,
                            address: ai >= 0 ? (c[ai] || '').trim() : '',
                            signer: si >= 0 ? (c[si] || '').trim() : '',
                            owner: owi >= 0 ? (c[owi] || '').trim() : '',
                            parcel: pi >= 0 ? (c[pi] || '').trim() : '',
                            status: sti >= 0 ? (c[sti] || 'IN PROGRESS').trim() : 'IN PROGRESS',
                            link: li >= 0 ? (c[li] || '').trim() : '' // 🔴 LINK STORE KARO
                        });
                    }
                }
                console.log('✅ Sheet:', dm.size, 'rows');
                console.log('🔗 Sample link:', dm.size > 0 ? Array.from(dm.values())[0].link : 'No link');
                return dm;
            } catch (e) {
                console.error('Sheet Error:', e);
                return new Map()
            }
        }

        function parseCSVRow(row) { const r = []; let cur = '', iq = false; for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch === '"') iq = !iq; else if (ch === ',' && !iq) { r.push(cur.trim()); cur = '' } else cur += ch } r.push(cur.trim()); return r.map(v => v.replace(/^"|"$/g, '')) }



        // 🔴🔴🔴 FIXED: Har OBJECTID_12 ka apna entry

        // 🔴🔴🔴 ABSOLUTE FINAL FIX - Har field guaranteed

        function updateAutocompleteFromSheet() {
            allOwners = [];
            allParcels = [];
            allAddresses = [];

            sheetDataMap.forEach((row, oid) => {
                const ownerValue = row.owner || '';
                const parcelValue = row.parcel || '';
                const addressValue = row.address || '';
                const linkValue = row.link || ''; // 🔴 LINK BHI STORE KARO

                if (ownerValue) {
                    allOwners.push({
                        value: ownerValue,
                        objectId: oid,
                        owner: ownerValue,
                        parcel: parcelValue,
                        address: addressValue,
                        status: row.status,
                        link: linkValue
                    });
                }

                if (parcelValue) {
                    allParcels.push({
                        value: parcelValue,
                        objectId: oid,
                        owner: ownerValue,
                        parcel: parcelValue,
                        address: addressValue,
                        status: row.status,
                        link: linkValue
                    });
                }

                if (addressValue) {
                    allAddresses.push({
                        value: addressValue,
                        objectId: oid,
                        owner: ownerValue,
                        parcel: parcelValue,
                        address: addressValue,
                        status: row.status,
                        link: linkValue
                    });
                }
            });

            allOwners.sort((a, b) => a.value.localeCompare(b.value));
            allParcels.sort((a, b) => a.value.localeCompare(b.value));
            allAddresses.sort((a, b) => a.value.localeCompare(b.value));
        }



        async function saveToSheet() {
            try {
                showLoading('Saving...');
                const d = [];
                allFeatures.forEach(f => {
                    if (f.properties._layerType === 'parcels') {
                        const oid = getObjectId(f.properties);
                        if (oid) {
                            d.push({
                                OBJECTID_12: oid,
                                ADDRESS: f.properties.ADDRESS || f.properties.address || '',
                                SIGNER: f.properties.SIGNER || f.properties.signer || '',
                                OWNER: f.properties.OWNER || f.properties.owner || '',
                                PARCEL: f.properties.PARCEL || f.properties.parcel || '',
                                STATUS: f.properties.Status || 'IN PROGRESS',
                                LINK: f.properties.LINK || f.properties.link || '' // 🔴 LINK BHI SAVE KARO
                            });
                        }
                    }
                });

                await fetch(CONFIG.SHEET_WRITE_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: d })
                });

                const ns = await loadSheetData();
                if (ns.size > 0) {
                    sheetDataMap = ns;
                    updateAutocompleteFromSheet();
                }

                showToast('✅ Saved!');
                hasChanges = false;
                hideLoading();
            } catch (e) {
                hideLoading();
                showToast('❌ Save failed!', true);
            }
        }



        function initMap() {
            if (map) { map.remove(); map = null; }

            // 🔴 DEFAULT MAP - SATELLITE
            const defaultMap = 'satellite';  // ✅ YEH CHANGE KARO
            const tileLayer = BASE_MAPS[defaultMap];

            map = L.map('map', { zoomControl: true }).setView(CONFIG.DEFAULT_VIEW, CONFIG.DEFAULT_ZOOM);

            L.tileLayer(tileLayer.url, {
                attribution: tileLayer.attribution,
                maxZoom: 19
            }).addTo(map);

            map.on('mousemove', function (e) {
                if (!hoveredLayer) return;
                if (!hoveredLayer.getBounds().contains(e.latlng)) {
                    hoveredLayer.setStyle(getFeatureStyle(hoveredLayer.feature));
                    hoveredLayer = null;
                }
            });

            setTimeout(() => { if (map) map.invalidateSize(); }, 500);
        }

        function loadGeoJSON(url, lt) { return fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() }).then(d => { d.features.forEach(f => { f.properties._layerType = lt; if (!f.properties.Status) f.properties.Status = 'IN PROGRESS' }); return d }) }

        function loadGeoJSON(url, lt) { return fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() }).then(d => { d.features.forEach(f => { f.properties._layerType = lt; if (!f.properties.Status) f.properties.Status = 'IN PROGRESS' }); return d }) }

        // 🔴🔴🔴 YEH FUNCTION ADD KARO - loadGeoJSON ke BAAD 🔴🔴🔴
        function changeBaseMap(mapType) {
            if (!map) return;

            // Purani tile layer hatao
            map.eachLayer(function (layer) {
                if (layer instanceof L.TileLayer) {
                    map.removeLayer(layer);
                }
            });

            // Naya tile layer add karo
            const tileLayer = BASE_MAPS[mapType];
            if (tileLayer) {
                L.tileLayer(tileLayer.url, {
                    attribution: tileLayer.attribution,
                    maxZoom: 19
                }).addTo(map);

                showToast('🗺️ ' + mapType.charAt(0).toUpperCase() + mapType.slice(1));
            }
        }

        async function loadAllLayers() {
            try {
                showLoading('Loading...');
                const [bd, pd, sd] = await Promise.all([
                    loadGeoJSON(CONFIG.BOUNDARY_URL, 'boundary'),
                    loadGeoJSON(CONFIG.PARCELS_URL, 'parcels'),
                    loadSheetData()
                ]);

                sheetDataMap = sd;
                let bf = bd.features, pf = pd.features, mc = 0;

                pf.forEach(f => {
                    const oid = getObjectId(f.properties);
                    if (oid && sd.has(oid)) {
                        const r = sd.get(oid);
                        f.properties.Status = r.status || 'IN PROGRESS';
                        f.properties.OWNER = r.owner || f.properties.OWNER || '';
                        f.properties.ADDRESS = r.address || f.properties.ADDRESS || '';
                        f.properties.SIGNER = r.signer || f.properties.SIGNER || '';
                        f.properties.PARCEL = r.parcel || f.properties.PARCEL || '';
                        f.properties.LINK = r.link || ''; // 🔴 LINK ADD KARO
                        mc++;
                    }
                });

                allFeatures = [...bf, ...pf];
                originalData = new Map();

                pf.forEach(f => {
                    const oid = getObjectId(f.properties);
                    if (oid) {
                        originalData.set(oid, {
                            address: f.properties.ADDRESS || '',
                            signer: f.properties.SIGNER || '',
                            owner: f.properties.OWNER || '',
                            parcel: f.properties.PARCEL || '',
                            status: f.properties.Status || 'IN PROGRESS',
                            link: f.properties.LINK || '' // 🔴 LINK ADD KARO
                        });
                    }
                });

                updateAutocompleteFromSheet();
                isDataLoaded = true;
                renderLayer();
                updateStats();

                hideLoading();
            

                // 🔴 DEBUG: Check karo link aaya ya nahi
                console.log('🔗 First feature LINK:', allFeatures.find(f => f.properties._layerType === 'parcels')?.properties?.LINK);
            } catch (e) {
                hideLoading();
                showToast('❌ ' + e.message, true);
            }
        }



        // 🔴🔴🔴 INTERCONNECTED SUGGESTIONS

        function showSuggestions(type) {

            let input, suggestionsDiv, data;

            if (type === 'owner') { input = document.getElementById('ownerFilter'); suggestionsDiv = document.getElementById('ownerSuggestions'); data = allOwners }

            else if (type === 'parcel') { input = document.getElementById('parcelFilter'); suggestionsDiv = document.getElementById('parcelSuggestions'); data = allParcels }

            else if (type === 'address') { input = document.getElementById('addressFilter'); suggestionsDiv = document.getElementById('addressSuggestions'); data = allAddresses }



            const value = input.value.toLowerCase().trim();



            const ownerValue = document.getElementById('ownerFilter').value.trim();

            const parcelValue = document.getElementById('parcelFilter').value.trim();

            const addressValue = document.getElementById('addressFilter').value.trim();



            let filtered = data.filter(item => {



                // Owner selected ho to sirf us owner ka data

                if (ownerValue && type !== 'owner' && item.owner !== ownerValue)

                    return false;



                // Parcel selected ho to sirf us parcel ka data

                if (parcelValue && type !== 'parcel' && item.parcel !== parcelValue)

                    return false;



                // Address selected ho to sirf us address ka data

                if (addressValue && type !== 'address' && item.address !== addressValue)

                    return false;



                // Jo textbox open hai usmein typing search

                if (value && !item.value.toLowerCase().includes(value))

                    return false;



                return true;

            });



            if (filtered.length > 0) {

                suggestionsDiv.innerHTML = '';

                filtered.forEach(item => {

                    const div = document.createElement('div');

                    div.className = 'suggestion-item';



                    let main = item.value;

                    let sub = '';

                    if (type === 'owner') sub = '📋 ' + (item.parcel || 'N/A') + ' | 📍 ' + (item.address ? item.address.substring(0, 30) : 'N/A');

                    else if (type === 'parcel') sub = '👤 ' + (item.owner || 'N/A') + ' | 📍 ' + (item.address ? item.address.substring(0, 30) : 'N/A');

                    else if (type === 'address') sub = '👤 ' + (item.owner || 'N/A') + ' | 📋 ' + (item.parcel || 'N/A');



                    // 🔴 DIV use karo taake neeche line mein aaye

                    div.innerHTML = '<div class="main">' + main + '</div><div class="sub">' + sub + '</div>';



                    // 🔴 CLICK = SIRF APNA BOX FILL KARO

                    div.addEventListener('mousedown', function (e) {

                        e.preventDefault();

                        e.stopPropagation();



                        // 🔴 SIRF wahi input fill karo jispe type kiya hai

                        input.value = item.value;



                        suggestionsDiv.classList.remove('show');

                        activeSuggestionsDiv = null;

                        filterAndFly(item.objectId);

                    });



                    suggestionsDiv.appendChild(div);

                });

                suggestionsDiv.classList.add('show');

                activeSuggestionsDiv = suggestionsDiv;

            } else {

                suggestionsDiv.classList.remove('show');

                activeSuggestionsDiv = null;

            }

        }

        function filterAndFly(objectId) {

            if (!isDataLoaded) return;

            const sid = objectId.toString().trim();

            const tf = allFeatures.find(f => getObjectId(f.properties) === sid && f.properties._layerType === 'parcels');

            if (!tf) { showToast('❌ Not found', true); return; }



            // 🔴 Purani layer aur timeout clear karo

            if (window.hlTimeout) clearTimeout(window.hlTimeout);

            if (window.zoomTimeout) clearTimeout(window.zoomTimeout);



            if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }



            const fts = allFeatures.filter(f => {

                if (f.properties._layerType === 'boundary') return true;

                return getObjectId(f.properties) === sid;

            });



            currentLayer = L.geoJSON(

                { type: 'FeatureCollection', features: fts },

                { style: getFeatureStyle, onEachFeature: onEachFeature }

            ).addTo(map);



            // 🔴 Zoom sirf ek baar, debounce ke saath

            window.zoomTimeout = setTimeout(() => {

                currentLayer.eachLayer(function (l) {

                    if (l.feature && getObjectId(l.feature.properties) === sid && l.feature.properties._layerType === 'parcels') {

                        try {

                            const b = l.getBounds();

                            if (b.isValid()) {

                                map.flyToBounds(b, { padding: [80, 80], maxZoom: 17, duration: 0.5 });

                            }

                        } catch (e) { }



                        // Highlight

                        highlightedFeature = l.feature;

                        l.setStyle({ color: '#FF0000', weight: 5, fillOpacity: 0.2, fillColor: '#FF0000' });

                        l.bringToFront();



                        window.hlTimeout = setTimeout(() => {

                            if (highlightedFeature === l.feature) {

                                l.setStyle(getFeatureStyle(l.feature));

                                highlightedFeature = null;

                            }

                        }, 4000);

                    }

                });

            }, 100);



            updateStats();

            showToast('📍 Click polygon for popup');

        }



        function applyFilters() {

            if (!isDataLoaded) return;

            const sf = document.getElementById('statusFilter').value;

            const of = document.getElementById('ownerFilter').value.toLowerCase().trim();

            const pf = document.getElementById('parcelFilter').value.toLowerCase().trim();

            const af = document.getElementById('addressFilter').value.toLowerCase().trim();

            if (sf === 'ALL' && !of && !pf && !af) { renderLayer(); return }

            if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null }

            let ftr = allFeatures.filter(f => { const p = f.properties; if (p._layerType === 'boundary') return true; const s = sf === 'ALL' || p.Status === sf; const o = !of || (p.OWNER || p.owner || '').toLowerCase().includes(of); const pa = !pf || (p.PARCEL || p.parcel || '').toLowerCase().includes(pf); const a = !af || (p.ADDRESS || p.address || '').toLowerCase().includes(af); return s && o && pa && a });

            if (ftr.length === 0) { showToast('⚠️ No matches', true); return }

            currentLayer = L.geoJSON({ type: 'FeatureCollection', features: ftr }, { style: getFeatureStyle, onEachFeature: onEachFeature }).addTo(map);

            try { const b = currentLayer.getBounds(); if (b.isValid()) map.fitBounds(b, { padding: [50, 50], maxZoom: 16 }) } catch (e) { map.setView(CONFIG.DEFAULT_VIEW, CONFIG.DEFAULT_ZOOM) }

            highlightedFeature = null; updateStats()

        }



        function renderLayer() { if (!isDataLoaded || allFeatures.length === 0) return; if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null } selectedFeatures = []; highlightedFeature = null; currentLayer = L.geoJSON({ type: 'FeatureCollection', features: allFeatures }, { style: getFeatureStyle, onEachFeature: onEachFeature }).addTo(map); try { const b = currentLayer.getBounds(); if (b.isValid()) map.fitBounds(b, { padding: [40, 40] }) } catch (e) { map.setView(CONFIG.DEFAULT_VIEW, CONFIG.DEFAULT_ZOOM) } updateStats() }



        function getFeatureStyle(feature) {
            const lt = feature.properties._layerType;
            const st = feature.properties.Status || 'IN PROGRESS';

            if (lt === 'boundary') {
                return {
                    fillColor: 'transparent',
                    color: '#FF0000',
                    weight: 2.5,
                    opacity: 1,
                    fillOpacity: 0
                };
            }

            // 🔴 HIGHLIGHT CHECK HATAYA - ab sirf normal style return karega
            const c = st === 'IN PROGRESS' ? '#FF8C00' : st === 'COMPLETED' ? '#10B981' : '#6B7280';
            return {
                fillColor: 'transparent',
                color: c,
                weight: 2,
                opacity: 1,
                fillOpacity: 0
            };
        }

        function onEachFeature(feature, layer) {
            layer.feature = feature;
            if (feature.properties._layerType === 'boundary') return;

            layer.bindPopup(createPopupContent(feature), { maxWidth: 350, closeOnClick: false });

            layer.on('click', function (e) {
                L.DomEvent.stopPropagation(e);

                // 🔴 SABSE PEHLE - Sab features normal karo
                if (currentLayer) {
                    currentLayer.eachLayer(function (l) {
                        if (l.feature && l.feature.properties._layerType === 'parcels') {
                            l.setStyle(getFeatureStyle(l.feature));
                            l.closePopup();
                        }
                    });
                }

                if (window.hlTimeout) clearTimeout(window.hlTimeout);

                // 🔴 Sirf yeh wala RED karo
                highlightedFeature = feature;
                this.setStyle({
                    color: '#FF0000',
                    weight: 5,
                    fillOpacity: 0.2,
                    fillColor: '#FF0000'
                });
                this.bringToFront();
                this.openPopup();
            });

            // 🔴🔴🔴 POPUP CLOSE = RED HATAO 🔴🔴🔴
            layer.on('popupclose', function () {
                if (highlightedFeature === feature) {
                    this.setStyle(getFeatureStyle(feature));
                    highlightedFeature = null;
                    if (window.hlTimeout) clearTimeout(window.hlTimeout);
                }
            });

            // HOVER
            layer.on('mouseover', function () {
                if (hoveredLayer && hoveredLayer !== this) {
                    hoveredLayer.setStyle(getFeatureStyle(hoveredLayer.feature));
                }
                hoveredLayer = this;
                if (highlightedFeature !== feature) {
                    const s = getFeatureStyle(feature);
                    this.setStyle({ color: s.color, weight: 3, fillOpacity: 0.1, fillColor: s.color });
                    this.bringToFront();
                }
            });

            layer.on('mouseout', function () {
                if (hoveredLayer === this) hoveredLayer = null;
                if (highlightedFeature !== feature) {
                    this.setStyle(getFeatureStyle(feature));
                }
            });
        }

        function createPopupContent(feature) {
            const p = feature.properties;
            const st = p.Status || 'IN PROGRESS';
            const sc = st === 'IN PROGRESS' ? '#FF8C00' : st === 'COMPLETED' ? '#10B981' : '#6B7280';
            const oid = getObjectId(p);
            const link = p.LINK || p.link || '';

            let h = '<div style="min-width:220px;font-family:Inter,sans-serif">';
            h += '<div style="background:#2F3E9E;color:white;padding:8px 12px;border-radius:6px 6px 0 0;font-weight:600;font-size:13px">📋 Property Details</div>';
            h += '<div style="padding:12px"><table style="width:100%;border-collapse:collapse;font-size:12px">';

            // 🔴 OBJECT ID HATA DIYA - SIRF YEH FIELDS
            const fields = [
                { l: 'Address', k: 'ADDRESS' },
                { l: 'Signer', k: 'SIGNER' },
                { l: 'Owner', k: 'OWNER' },
                { l: 'Parcel', k: 'PARCEL' }
            ];

            fields.forEach(f => {
                let v = p[f.k] || p[f.k.toLowerCase()] || '';
                if (v) {
                    h += '<tr><td style="padding:4px 8px;font-weight:600;color:#4B5563">' + f.l + ':</td><td style="padding:4px 8px">' + v + '</td></tr>';
                }
            });

            // 🔴 LINK ROW - Agar link hai toh dikhao
            if (link && link.trim() !== '') {
                h += '<tr><td style="padding:4px 8px;font-weight:600;color:#4B5563">🔗 Link:</td>';
                h += '<td style="padding:4px 8px">';
                h += '<a href="' + link + '" target="_blank" style="color:#2F3E9E;font-weight:600;text-decoration:none;border-bottom:1px solid #2F3E9E;">';
                h += '📄 Open Sheet';
                h += '</a>';
                h += '</td></tr>';
            }

            h += '<tr><td style="padding:4px 8px;font-weight:600;color:#4B5563">Status:</td><td style="padding:4px 8px"><span style="color:' + sc + ';font-weight:bold">' + st + '</span></td></tr>';
            h += '</table>';

            // 🔴 Buttons - IN PROGRESS + COMPLETED + SAVE
            h += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #E5E7EB;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">';
            h += '<button onclick="updateFeatureStatus(\'' + oid + '\',\'IN PROGRESS\')" style="background:#FF8C00;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600">⏳ IN PROGRESS</button>';
            h += '<button onclick="updateFeatureStatus(\'' + oid + '\',\'COMPLETED\')" style="background:#10B981;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600">✅ COMPLETED</button>';
            h += '<button onclick="saveSingleAndClose(\'' + oid + '\')" style="background:#2F3E9E;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600">💾 Save</button>';
            h += '</div>';

            h += '</div></div>';
            return h;
        }
        // 🔴 NAYA FUNCTION - Popup ke Save button ke liye

        window.saveSingleAndClose = function (oid) {

            saveToSheet();

            map.closePopup();

        };



        window.updateFeatureStatus = function (oid, st) {
            const sid = oid.toString().trim();
            const f = allFeatures.find(ft => getObjectId(ft.properties) === sid && ft.properties._layerType === 'parcels');
            if (f) {
                f.properties.Status = st;
                hasChanges = true;
                if (currentLayer) {
                    currentLayer.eachLayer(function (l) {
                        if (l.feature === f) {
                            l.setStyle(getFeatureStyle(f));
                            // 🔴 Popup content update + DOBARA OPEN
                            l.setPopupContent(createPopupContent(f));
                            l.openPopup();
                        }
                    });
                }
                updateStats();
                showToast('✅ ' + st + ' | 💾 Save to update Sheet');
            } else {
                showToast('❌ Not found!', true);
            }
        };


        function updateStats() { const pf = allFeatures.filter(f => f.properties._layerType === 'parcels'); document.getElementById('totalCount').textContent = pf.length; document.getElementById('inprogressCount').textContent = pf.filter(f => f.properties.Status === 'IN PROGRESS').length; document.getElementById('completedCount').textContent = pf.filter(f => f.properties.Status === 'COMPLETED').length }



        function clearAllFilters() { document.getElementById('statusFilter').value = 'ALL'; document.getElementById('ownerFilter').value = ''; document.getElementById('parcelFilter').value = ''; document.getElementById('addressFilter').value = ''; document.querySelectorAll('.suggestions-dropdown').forEach(el => el.classList.remove('show')); activeSuggestionsDiv = null; highlightedFeature = null; renderLayer(); showToast('✅ Cleared') }

        function markSelectedAs(st) { if (selectedFeatures.length === 0) { showToast('⚠️ Select features first', true); return } selectedFeatures.forEach(f => f.properties.Status = st); hasChanges = true; applyFilters(); updateStats(); showToast('✅ ' + selectedFeatures.length + ' → ' + st); selectedFeatures = [] }

        function clearSelection() { selectedFeatures = []; if (currentLayer) currentLayer.eachLayer(l => l.setStyle(getFeatureStyle(l.feature))) }

        function resetChanges() { if (!hasChanges) { showToast('ℹ️ No changes'); return } allFeatures.forEach(f => { if (f.properties._layerType === 'parcels') { const oid = getObjectId(f.properties); if (oid && originalData.has(oid)) f.properties.Status = originalData.get(oid).status } }); hasChanges = false; selectedFeatures = []; highlightedFeature = null; renderLayer(); updateStats(); showToast('🔄 Reset') }

        function saveChanges() { if (!hasChanges) { showToast('ℹ️ No changes'); return } saveToSheet() }



        document.addEventListener('mousedown', function (e) { if (!e.target.closest('.suggestions-wrapper')) { document.querySelectorAll('.suggestions-dropdown').forEach(el => el.classList.remove('show')); activeSuggestionsDiv = null } });

        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { document.querySelectorAll('.suggestions-dropdown').forEach(el => el.classList.remove('show')); activeSuggestionsDiv = null; clearSelection(); highlightedFeature = null; if (currentLayer) currentLayer.eachLayer(l => l.setStyle(getFeatureStyle(l.feature))) } if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveChanges() } if (e.ctrlKey && e.key === 'r') { e.preventDefault(); resetChanges() } });



        document.addEventListener('DOMContentLoaded', function () {
            initMap();
            loadAllLayers();

            // 🔴🔴🔴 YEH LINE ADD KARO 🔴🔴🔴
            document.getElementById('baseMapSelector').addEventListener('change', function (e) {
                changeBaseMap(e.target.value);
            });

            document.getElementById('clearFiltersBtn').addEventListener('click', clearAllFilters);
            document.getElementById('markInProgress').addEventListener('click', () => markSelectedAs('IN PROGRESS'));
            document.getElementById('markCompleted').addEventListener('click', () => markSelectedAs('COMPLETED'));
            document.getElementById('clearSelection').addEventListener('click', clearSelection);
            document.getElementById('resetChanges').addEventListener('click', resetChanges);
            document.getElementById('saveChanges').addEventListener('click', saveChanges);
        });

        console.log('🏘️ FINAL FIXED - All 3 Filters Interconnected');

    </script>

</body>
